[project]
name = "sourceforge"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "rdndds", email = "rdndds@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "aiogram>=3.17.0",
    "asyncssh>=2.17.0",
    "curl-cffi>=0.16.3",
    "loguru>=0.7.3",
    "flask>=3.0.0",
    "rich>=15.0.0",
    "rich-click>=1.9.9",
]

[project.scripts]
sourceforge = "sourceforge:main"
sf = "sourceforge:main"
gofile = "gofile:main"
gf = "gofile:main"
vikingfile = "vikingfile:main"
vf = "vikingfile:main"
pixeldrain = "pixeldrain:main"
pd = "pixeldrain:main"
telegram = "telegram:main"
tg = "telegram:main"
web = "web:main"
gui = "web:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff>=0.17.1",
]

[tool.ruff.lint]
ignore = ["BLE001", "ASYNC230", "S324", "S110", "SIM115"]

[tool.hatch.build.targets.wheel]
packages = ["src/sourceforge", "src/gofile", "src/vikingfile", "src/pixeldrain", "src/telegram", "src/web"]

