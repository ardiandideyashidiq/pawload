name: Build Frontend & Auto-sync

on:
  push:
    branches:
      - main
    paths:
      - "frontend/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        working-directory: frontend
        run: bun install --frozen-lockfile

      - name: Build frontend distribution
        working-directory: frontend
        run: bun run build

      - name: Commit and push rebuilt static assets
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/web/dist/
          if git diff --staged --quiet; then
            echo "No changes in src/web/dist/ to commit."
          else
            git commit -m "chore(ci): rebuild frontend static assets [skip ci]"
            git push
          fi
